name: Native iOS preview
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Full build or a simulator design review
        type: choice
        options: [full, design, device]
        default: full
permissions:
  contents: read
concurrency:
  group: lumo-native-preview
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          if ! command -v xcodegen >/dev/null; then brew install xcodegen; fi
      - name: Verify native transport
        if: inputs.mode == 'full'
        run: |
          node tools/bundle-engine.mjs
          git diff --exit-code -- Sources/LumoCore/Resources/finance-engine.js engine-manifest.json Vendor/Finance
          node --test tests/bridge.test.mjs
          swift test
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build device application
        if: inputs.mode != 'design'
        run: |
          set -o pipefail
          mkdir -p build/artifacts
          xcodebuild -project lumo.xcodeproj -scheme lumo -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/artifacts/device-build.log
          mkdir -p build/package/Payload
          cp -R build/device/Build/Products/Release-iphoneos/lumo.app build/package/Payload/
          cd build/package && zip -qry ../artifacts/lumo-unsigned.ipa Payload
      - name: Verify device archive
        if: inputs.mode != 'design'
        run: python3 tools/verify-ipa.py build/artifacts/lumo-unsigned.ipa
      - name: Build and launch fresh simulator
        if: inputs.mode != 'device'
        run: bash tools/simulator-check.sh prepare
      - name: Upload first real preview
        if: inputs.mode != 'device'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lumo-early-preview
          path: |
            build/artifacts/lumo-overview.png
            build/artifacts/lumo-unsigned.ipa
          retention-days: 1
      - name: Native UI checks
        if: inputs.mode != 'device'
        run: bash tools/simulator-check.sh test
      - name: Upload preview and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lumo-native-preview
          path: |
            build/artifacts/
          retention-days: 1
      - name: Remove isolated simulator
        if: always()
        run: |
          if [ -f build/sim-device.txt ]; then
            device=$(cat build/sim-device.txt)
            xcrun simctl shutdown "$device" || true
            xcrun simctl delete "$device" || true
          fi
